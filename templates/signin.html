<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
</head>
<body style="margin: 0; font-family: Arial, sans-serif; background-color:rgb(120, 88, 88); display: flex; flex-direction: column; min-height: 100vh;">
          <div style="flex: 1; display: flex; justify-content: center; align-items: center;">
          <div style="background-color: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); width: 320px;">
            <h2 style="text-align: center; margin-bottom: 25px; color: #333;">Register</h2>
            <form action="/signin" method="POST">
                <div style="margin-bottom: 15px;">
                    <label for="email" style="display: block; margin-bottom: 5px; color: #555;">Email</label>
                    <input type="email" id="email" name="email" required
                           style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>
                <div style="margin-bottom: 20px;">
                    <label for="password" style="display: block; margin-bottom: 5px; color: #555;">Password</label>
                    <input type="password" id="password" name="password" required
                           style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
                </div>
                <button type="submit"
                        style="width: 100%; padding: 10px; background-color: #28a745; border: none; color: white; border-radius: 5px; font-size: 16px; cursor: pointer;">
                    Save
                </button>
            </form>
            <div style="margin-top: 15px; text-align: center;">
                <a href="/forgot-password" style="font-size: 14px; color: #007BFF; text-decoration: none;">
                    Forgot Password?
                </a>
            </div>
        </div>
    </div>

    <footer style="text-align: center; padding: 15px 0; background-color: #fff; color: #888; font-size: 14px;">
        <p>&copy; 2025 E-commerce Site</p>
    </footer>

</body>
</html>
