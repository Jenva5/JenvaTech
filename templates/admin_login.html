<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login | JenvaTech</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Link to your CSS file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="admin">
        <div>
            <h2>Admin Login</h2>

            {% if error %}
                <p style="color: red; font-size: 14px; text-align: center; margin-bottom: 15px;">{{ error }}</p>
            {% endif %}

            <form method="post">
               <b> <input type="text" name="username" placeholder="Admin Username" required></b>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>

            <p style="text-align: center; margin-top: 15px; font-size: 20px;">
                <a href="/">← Back to Home</a>
            </p>
        </div>
    </div>
</body>
</html>
